name: tests

# Runs on every PR and on pushes to main. Railway's "Wait for CI" setting can
# be switched on once this has gone green, which makes a passing suite a
# precondition for production rebuilding.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Exact patch, matching the Dockerfile base image and runtime.txt. All
      # three now name the same interpreter, so a green check here is evidence
      # about the version production actually runs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No secrets needed: the suite passes with a bare environment, and the
      # Anthropic client is constructed as None when no API key is present.
      # `python -m pytest`, not bare `pytest`: the -m form puts the working
      # directory on sys.path, which is how the top-level `services`, `app`
      # and `app_core` modules get imported. The console script does not, and
      # collection fails with ModuleNotFoundError: No module named 'services'.
      - name: Run tests
        run: python -m pytest -q

      # The suite exercises the app through Flask's test client, which never
      # starts a real server. PR #18 shipped a break that only appeared in a
      # running process, so boot the app the way production does -- gunicorn
      # with --preload -- and hit the healthcheck Railway polls.
      - name: Smoke test the production boot path
        run: |
          gunicorn --workers=2 --threads=2 --timeout=120 --preload \
            --bind=127.0.0.1:8099 --log-level=warning wsgi:app &
          GP=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/healthz && break
            sleep 1
          done
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/healthz)
          ROOT=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          kill $GP 2>/dev/null || true
          echo "/healthz -> $HEALTH"
          echo "/        -> $ROOT"
          test "$HEALTH" = "200" && test "$ROOT" = "200"
